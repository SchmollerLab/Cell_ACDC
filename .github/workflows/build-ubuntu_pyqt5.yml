# flake8 and the tests on Ubuntu with PyQt5, Python 3.10 to 3.13.
# - Pull requests: the fast tier, i.e. the smoke tests and the tests not
#   marked slow or flaky (a few minutes).
#   The job related-tests also runs the slow and flaky tests of the
#   test files related to the changes (tests/related_tests.py), once.
# - Pushes to main (merges) and every Monday: the full suite (the badges in
#   README.rst show this status).
# Run the full suite of a pull request before merging it with the
# "full tests" label (full-tests.yml). See "Running the tests" in
# cellacdc/docs/source/contributing.rst.
# The job id and matrix give the check names "build (3.10)", ... that the
# main branch ruleset requires: keep them.

name: Ubuntu build, lint and test (PyQt5)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  # A new push to a pull request cancels the run of the previous one
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    # A hung test must not run until the default limit of 6 h (the full
    # suite takes 20-40 min)
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 90 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-cellacdc
      with:
        python-version: ${{ matrix.python-version }}
        qt: pyqt5
    - name: Lint with flake8
      shell: bash
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
      # --durations lists the slowest tests run. In the fast tier these are
      # the candidates for the slow marker (see CLAUDE.md, Testing)
      run: |
        if [ "$EVENT_NAME" = pull_request ]; then
          python -m pytest -m "(smoke or not slow) and not flaky" --durations=25
        else
          python -m pytest --durations=25
        fi

  related-tests:
    # Not a required check: the full suite runs before merging anyway
    if: github.event_name == 'pull_request'
    timeout-minutes: 90
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        # HEAD is the merge commit of the pull request and HEAD^1 its base
        fetch-depth: 2
    - uses: ./.github/actions/setup-cellacdc
      with:
        python-version: "3.12"
        qt: pyqt5
    - name: Test with pytest (slow and flaky tests related to the changes)
      shell: bash
      run: |
        if ! selected=$(python tests/related_tests.py --base HEAD^1); then
          echo "::warning::tests/related_tests.py failed: running every slow and flaky test"
          selected=tests
        fi
        if [ -z "$selected" ]; then
          echo "No test file is related to the changed files."
          exit 0
        fi
        mapfile -t related <<< "$selected"
        status=0
        python -m pytest -m "(slow and not smoke) or flaky" --durations=25 "${related[@]}" || status=$?
        # 5: the related files have no slow or flaky tests (all deselected)
        if [ "$status" -eq 5 ]; then exit 0; fi
        exit "$status"
