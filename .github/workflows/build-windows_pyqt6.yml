# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Windows build, lint and test (PyQt6)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip cache purge
        python -m pip install flake8 pytest
        python -m pip install -e .
        python -m pip install -r requirements_gui_pyqt6.txt
    - name: Install optional readers (bioio)
      continue-on-error: true
      run: |
        python -m pip install "bioio>=3.0,<4" "bioio-tifffile>=1.3,<2"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
    - name: Slow data-structure tests (Module 0 goldens through child processes)
      if: matrix.python-version == '3.12'
      env:
        ACDC_SLOW_TESTS: '1'
      run: |
        pytest tests/datastruct/test_golden_module0.py tests/datastruct/test_bioio_writer.py
