name: Set up Cell-ACDC for testing
description: >-
  Install Python, Cell-ACDC with the GUI requirements of a Qt binding, pytest
  and flake8, and start a virtual display on Linux. Shared by the test
  workflows (build-*.yml, full-tests-matrix.yml).

inputs:
  python-version:
    description: Python version to install
    required: true
  qt:
    description: Qt binding of the GUI requirements file (pyqt5 or pyqt6)
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Start a virtual display
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils
        /sbin/start-stop-daemon --start --quiet --pidfile /tmp/custom_xvfb_99.pid --make-pidfile --background --exec /usr/bin/Xvfb -- :99 -screen 0 1920x1200x24 -ac +extension GLX
        echo "DISPLAY=:99.0" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip cache purge
        python -m pip install flake8 pytest
        python -m pip install -e .
        python -m pip install -r requirements_gui_${{ inputs.qt }}.txt
